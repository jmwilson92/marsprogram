; Rendering setup per brief §2: Lumen + Nanite, virtual shadow maps, TSR.
; No ray tracing requirement. Target 60fps at 1440p on a mid-range GPU.

[/Script/EngineSettings.GameMapsSettings]
; AAresGameModeBase is a C++ class, not a Blueprint asset, so this reference is
; safe even though the project ships no content yet. It makes ANY map — a stock
; empty one included — play as MARS: first-person AAresCharacter, Enhanced
; Input, no per-map setup.
GlobalDefaultGameMode=/Script/AresGame.AresGameModeBase

; Map defaults stay commented until the maps exist. Pointing these at missing
; assets fails on editor open. M1 slice 3 creates L_Cape (brief §4.2).
; GameDefaultMap=/Game/Maps/L_Persistent.L_Persistent
; EditorStartupMap=/Game/Maps/L_Persistent.L_Persistent

[/Script/Engine.RendererSettings]
; --- Lumen ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs=1

; --- Nanite ---
r.Nanite=1
r.Nanite.ProjectEnabled=True

; --- Shadows ---
r.Shadow.Virtual.Enable=1
r.ShadowQuality=5

; --- Anti-aliasing: TSR ---
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200

; --- Ray tracing off; Lumen software tracing is the target ---
r.RayTracing=False
r.SkinCache.CompileShaders=False

; --- Large World Coordinates. The astro frame in AresCore is double precision
;     regardless, but the render frame stays human-scale (brief §3.3), so LWC is
;     a safety net rather than something the design leans on. ---
r.GPUScene.MaxInstances=2097152

[/Script/Engine.Engine]
; Fixed-step determinism aid: the program sim never reads DeltaTime directly,
; but capping smoothing keeps flight-phase interpolation stable.
bSmoothFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0
